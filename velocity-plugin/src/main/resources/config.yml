#  Author: muvixo
# ============================================================

# Plugin messaging channel. MUST match the Spigot side.
channel: "velocitylogs:main"

# ---------------- Behaviour ----------------
show-to-self: false
log-to-console: true
debug: true
op-cache-expire-minutes: 30

# ---------------- Message Format ----------------
message-format: "&8[&cLogs&8] &e{player} &8>> &b{server} &8>> &f/{command}"
reload-success-message: "&a[OK] Config reloaded successfully!"
no-permission-message: "&c[!] You don't have permission to do that!"