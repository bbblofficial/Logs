name: Build Plugins

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build all modules
        run: mvn -B clean package --file pom.xml

      - name: List artifacts
        run: |
          ls -la velocity-plugin/target/*.jar || true
          ls -la spigot-plugin/target/*.jar || true

      - name: Upload Velocity plugin
        uses: actions/upload-artifact@v4
        with:
          name: velocity-logs-velocity
          path: velocity-plugin/target/velocity-logs-velocity-*.jar
          if-no-files-found: error

      - name: Upload Spigot plugin
        uses: actions/upload-artifact@v4
        with:
          name: velocity-logs-spigot
          path: spigot-plugin/target/velocity-logs-spigot-*.jar
          if-no-files-found: error
