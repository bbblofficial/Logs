# ============================================================
#  VelocityLogs-Spigot v2.1 - backend config
#  Author: muvixo
# ============================================================

# Plugin messaging channel. MUST match the Velocity side.
channel: "velocitylogs:main"

# Name of this backend server.
# Leave empty to auto-detect.
server-name: ""

# Send commands to the proxy even for OP players?
log-ops: true

# Send OP status to the proxy on player join, quit, AND with every command?
# (v2.1 fix: sending it with every command clears stale OP entries.)
report-op-status: true

# Also report OP status periodically as a safety net.
# Lower = faster sync, slightly more traffic. 1 is a good value.
op-status-interval-minutes: 1

# Hide these commands from being forwarded.
blacklist:
  - "login"
  - "register"
  - "changepassword"

# Ignore commands from these players entirely.
ignored-players: []

# ============================================================
#  Permission Nodes
#  Read by /vlogs help to decide which commands to show.
#  Override any node here to use a different permission name.
# ============================================================
permissions:
  use:      "velocitylogs.use"
  creator:  "velocitylogs.creator"

  admin:    "velocitylogs.admin"
  reload:   "velocitylogs.reload"
  status:   "velocitylogs.status"
  toggle:   "velocitylogs.toggle"
  debug:    "velocitylogs.debug"